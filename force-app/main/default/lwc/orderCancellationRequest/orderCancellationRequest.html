<template>
    <div class="wrap">
        <template lwc:if={isLoading}>
            <p class="status-text">Checking cancellation options...</p>
        </template>

        <template lwc:if={showSuccessBanner}>
            <div class="banner banner--success" role="status">
                {submitMessage}
            </div>
        </template>

        <template lwc:if={showPendingBanner}>
            <div class="banner banner--pending" role="status">
                Cancellation requested — under review (Case #{caseNumber})
            </div>
        </template>

        <template lwc:if={showRequestButton}>
            <button class="request-btn" type="button" onclick={openModal}>
                Request Cancellation
            </button>
        </template>

        <template lwc:if={showIneligibleMessage}>
            <p class="status-text">{eligibilityMessage}</p>
        </template>
    </div>

    <template lwc:if={isModalOpen}>
        <section
            class="modal-backdrop"
            role="presentation"
            onclick={handleBackdropClick}
        >
            <div
                class="modal"
                role="dialog"
                aria-modal="true"
                aria-labelledby="cancellation-modal-title"
                onclick={handleDialogClick}
            >
                <header class="modal__header">
                    <h2 id="cancellation-modal-title" class="modal__title">
                        {modalTitle}
                    </h2>
                    <button
                        class="modal__close"
                        type="button"
                        title="Close"
                        onclick={closeModal}
                    >
                        ×
                    </button>
                </header>

                <div class="modal__body">
                    <lightning-combobox
                        name="reason"
                        label="Reason"
                        value={selectedReason}
                        placeholder="Select a reason"
                        options={reasonOptions}
                        required
                        onchange={handleReasonChange}
                    ></lightning-combobox>

                    <lightning-textarea
                        name="comments"
                        label="Comments (optional)"
                        value={comments}
                        maxlength="1000"
                        onchange={handleCommentsChange}
                    ></lightning-textarea>

                    <label class="checkbox-row">
                        <input
                            type="checkbox"
                            checked={acknowledged}
                            onchange={handleAcknowledgedChange}
                        />
                        <span>
                            I understand cancellation is subject to review and may
                            not be possible after fulfillment begins.
                        </span>
                    </label>

                    <template lwc:if={submitError}>
                        <p class="error-text" role="alert">{submitError}</p>
                    </template>
                </div>

                <footer class="modal__footer">
                    <button
                        class="btn btn--secondary"
                        type="button"
                        disabled={isSubmitting}
                        onclick={closeModal}
                    >
                        Cancel
                    </button>
                    <button
                        class="btn btn--primary"
                        type="button"
                        disabled={isSubmitDisabled}
                        onclick={handleSubmit}
                    >
                        {isSubmitting ? 'Submitting...' : 'Submit Request'}
                    </button>
                </footer>
            </div>
        </section>
    </template>
</template>
